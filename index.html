<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cobblemon LivingDex</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brand-mark">◈</div><div><h1>Cobblemon LivingDex</h1><span>Personal collection tracker</span></div></div>
  <div class="progress-wrap"><div class="progress-label"><b id="progressText">0 / 0</b><span id="progressPct">0%</span></div><div class="progress"><i id="progressBar"></i></div></div>
  <div class="header-actions"><button id="resetBtn" class="ghost">Reset collectie</button><div class="settings-wrap"><button id="settingsBtn" class="ghost settings-btn">⚙ <span id="settingsTitle">Instellingen</span></button><div id="settingsMenu" class="settings-menu"><label id="settingsLangLabel">Taal</label><select id="settingsLang"><option value="nl">Nederlands</option><option value="en">English</option></select><label id="settingsThemeLabel">Thema</label><select id="settingsTheme"><option value="dark">Donker</option><option value="light">Light</option></select></div></div></div>
</header>
<main>
  <div class="category-nav">
    <label for="tabSelect">Weergave</label>
    <select id="tabSelect" class="tab-select"></select>
  </div>
  <section class="toolbar">
    <div class="search"><span>⌕</span><input id="search" placeholder="Zoek Pokémon, vorm of type (bv. vuur of vuur/water)..."></div>
    <div class="filters"><button class="filter active" data-status="all">Alle</button><button class="filter" data-status="missing">Niet verzameld</button><button class="filter" data-status="collected">Verzameld</button></div><button id="typesBtn" class="types-btn">Types</button>
  </section>
  <div id="subInfo" class="subinfo"></div>
  <div id="boxHeading" class="box-heading">Box 1</div>
  <section id="grid" class="grid"></section>
  <div id="empty" class="empty" hidden>Geen Pokémon gevonden.</div>
  <footer class="pager"><button id="prev">←</button><span id="pageInfo"></span><button id="next">→</button></footer>
</main>
<div id="typeOverlay" class="modal-overlay" hidden></div><div id="typeModal" class="type-modal" hidden><button id="typeModalClose" class="info-close">×</button><h2 id="typeModalTitle">Types</h2><div id="typeOptions" class="type-options"></div></div><div id="infoOverlay" class="info-overlay" hidden></div>
<aside id="infoDropdown" class="info-dropdown" hidden>
  <button id="infoClose" class="info-close" aria-label="Sluiten">×</button>
  <div id="infoContent"></div>
</aside>
<script src="data/cobblemon_local.js"></script>
<script src="app.js"></script>
</body></html>
